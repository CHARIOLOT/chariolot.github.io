<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Roulette</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
  --red: #e03030;
  --dark-red: #8a0000;
  --green: #2ecc71;
  --dark: #0a0a0f;
  --panel: #12121a;
  --border: #2a2a3a;
  --gold: #f0c030;
  --text: #e0e0e0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--dark);
  font-family: 'Press Start 2P', monospace;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 8px 32px;
  background-image: repeating-linear-gradient(0deg,transparent,transparent 31px,rgba(255,255,255,0.015) 31px,rgba(255,255,255,0.015) 32px),repeating-linear-gradient(90deg,transparent,transparent 31px,rgba(255,255,255,0.015) 31px,rgba(255,255,255,0.015) 32px);
}

h1 {
  font-size: 14px;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(240,192,48,0.6), 3px 3px 0 #000;
  margin-bottom: 4px;
  letter-spacing: 2px;
  text-align: center;
}

.subtitle {
  font-size: 6px;
  color: #555;
  margin-bottom: 16px;
  letter-spacing: 3px;
}

/* SCREENS */
#startScreen, #setupScreen, #gameScreen { display: none; width: 100%; max-width: 360px; }
#startScreen { display: flex; flex-direction: column; align-items: center; }

/* START SCREEN */
.start-box {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 4px;
  padding: 28px 20px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

.skull-big { font-size: 48px; margin-bottom: 16px; display: block; animation: pulse 1.5s infinite; }

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.big-btn {
  width: 100%;
  border: none;
  border-radius: 4px;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.1s;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.big-btn:active { transform: translateY(3px); }

.btn-start {
  background: var(--gold);
  color: #000;
  border-bottom: 4px solid #a08000;
}
.btn-start:hover { background: #ffe040; }

.btn-settings {
  background: #1e1e2e;
  color: #888;
  border: 2px solid var(--border);
  border-bottom: 4px solid #111;
  font-size: 9px;
}
.btn-settings:hover { color: var(--text); border-color: #555; }

/* SETTINGS SCREEN */
#settingsScreen {
  display: none;
  width: 100%;
  max-width: 360px;
}

.settings-box {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 4px;
  padding: 20px 16px;
  width: 100%;
}

.settings-title {
  font-size: 9px;
  color: var(--gold);
  text-align: center;
  margin-bottom: 20px;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.setting-label { font-size: 7px; color: var(--text); }

/* Toggle switch */
.toggle {
  position: relative;
  width: 44px;
  height: 24px;
}

.toggle input { display: none; }

.toggle-slider {
  position: absolute;
  inset: 0;
  background: #333;
  border-radius: 24px;
  cursor: pointer;
  transition: 0.2s;
  border: 2px solid var(--border);
}

.toggle-slider:before {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  background: #666;
  border-radius: 50%;
  left: 2px;
  top: 2px;
  transition: 0.2s;
}

.toggle input:checked + .toggle-slider { background: #1a3a1a; border-color: var(--green); }
.toggle input:checked + .toggle-slider:before { background: var(--green); transform: translateX(20px); }

.btn-back {
  width: 100%;
  margin-top: 16px;
  background: #1e1e2e;
  border: 2px solid var(--border);
  border-bottom: 4px solid #111;
  border-radius: 4px;
  color: #888;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px;
  cursor: pointer;
}
.btn-back:hover { color: var(--text); }

/* SETUP SCREEN */
.setup-box {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 4px;
  padding: 20px 16px;
  width: 100%;
}

.setup-title {
  font-size: 8px;
  color: var(--gold);
  text-align: center;
  margin-bottom: 16px;
  text-shadow: 0 0 10px rgba(240,192,48,0.4);
}

.bomb-options {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 20px;
}

.bomb-opt {
  background: #1a1a2a;
  border: 2px solid var(--border);
  border-radius: 4px;
  padding: 10px 4px;
  cursor: pointer;
  text-align: center;
  transition: all 0.1s;
}

.bomb-opt:hover { border-color: var(--red); }
.bomb-opt.selected {
  border-color: var(--gold);
  background: #1f1a00;
  box-shadow: 0 0 12px rgba(240,192,48,0.3);
}

.bomb-opt .num { font-size: 16px; color: var(--red); display: block; margin-bottom: 4px; }
.bomb-opt .label { font-size: 5px; color: #666; display: block; }
.bomb-opt .mult { font-size: 5px; color: var(--gold); display: block; margin-top: 3px; }

.play-btn {
  width: 100%;
  background: var(--red);
  border: none;
  border-bottom: 4px solid var(--dark-red);
  border-radius: 4px;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.1s;
  margin-bottom: 8px;
}
.play-btn:hover { background: #ff4040; }
.play-btn:active { border-bottom-width: 1px; transform: translateY(3px); }

/* HUD */
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  margin-bottom: 10px;
  font-size: 7px;
}

.hud-item { text-align: center; }
.hud-val { color: var(--gold); font-size: 11px; display: block; margin-top: 2px; }
.hud-val.red { color: var(--red); }

.round-banner {
  text-align: center;
  font-size: 7px;
  color: #555;
  margin-bottom: 10px;
  letter-spacing: 2px;
}

.cards-area {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.card {
  aspect-ratio: 2/3;
  background: #1a1a2e;
  border: 2px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  overflow: hidden;
}

.card:hover:not(.revealed):not(.disabled) {
  transform: translateY(-4px) scale(1.03);
  border-color: var(--gold);
  box-shadow: 0 8px 20px rgba(240,192,48,0.2);
}

.card.revealed { cursor: default; animation: flipCard 0.3s ease; }
.card.bomb { border-color: var(--red); background: #1a0000; box-shadow: 0 0 20px rgba(224,48,48,0.4); }
.card.safe { border-color: var(--green); background: #001a08; box-shadow: 0 0 20px rgba(46,204,113,0.3); }
.card.disabled { cursor: default; opacity: 0.4; }

@keyframes flipCard {
  0% { transform: scaleX(0); }
  100% { transform: scaleX(1); }
}

.card canvas { image-rendering: pixelated; width: 60%; height: 60%; }

.card-back {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: repeating-linear-gradient(45deg,#1a1a2e,#1a1a2e 4px,#16162a 4px,#16162a 8px);
}

.card-back-icon { font-size: 24px; opacity: 0.3; }

.info-bar {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 6px;
  color: #555;
  text-align: center;
  line-height: 2;
}

.info-bar span { color: var(--text); }
.info-bar .danger { color: var(--red); }

#resultOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.result-box {
  background: var(--panel);
  border: 3px solid var(--border);
  border-radius: 8px;
  padding: 28px 24px;
  text-align: center;
  max-width: 300px;
  width: 90%;
}

.result-title { font-size: 14px; margin-bottom: 12px; }
.result-title.win { color: var(--gold); text-shadow: 0 0 20px rgba(240,192,48,0.6); }
.result-title.lose { color: var(--red); text-shadow: 0 0 20px rgba(224,48,48,0.6); }

.result-score { font-size: 8px; color: #888; margin-bottom: 6px; }
.result-pts { font-size: 20px; color: var(--gold); margin-bottom: 20px; text-shadow: 0 0 15px rgba(240,192,48,0.5); }
.result-btns { display: flex; gap: 10px; flex-direction: column; }

.btn-next {
  background: var(--green);
  border: none;
  border-bottom: 3px solid #1a8a4a;
  border-radius: 4px;
  color: #000;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 10px;
  cursor: pointer;
}

.btn-quit {
  background: #222;
  border: 2px solid var(--border);
  border-radius: 4px;
  color: #666;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  padding: 8px;
  cursor: pointer;
}

.btn-next:hover { background: #3edc81; }
.btn-quit:hover { color: var(--red); border-color: var(--red); }

@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.shake { animation: shake 0.4s ease; }
</style>
</head>

<script>
// State
let bombCount = 1, score = 0, round = 1, cards = [], roundOver = false, multiplier = 1;
let soundOn = true;
let lastResult = 'win'; // 'win' or 'lose'

function playSound(id) {
  if (!soundOn) return;
  try {
    const s = document.getElementById(id);
    s.currentTime = 0;
    let p = s.play();
    if (p) p.catch(e => {});
  } catch(e) {}
}

// Screen management
function showScreen(id) {
  ['startScreen','settingsScreen','setupScreen','gameScreen'].forEach(s => {
    document.getElementById(s).style.display = 'none';
  });
  document.getElementById(id).style.display = id === 'startScreen' ? 'flex' : 'block';
}

// Start screen
document.getElementById('btnStart').addEventListener('click', () => showScreen('setupScreen'));
document.getElementById('btnGoSettings').addEventListener('click', () => showScreen('settingsScreen'));
document.getElementById('btnBackSettings').addEventListener('click', () => showScreen('startScreen'));
document.getElementById('btnBackSetup').addEventListener('click', () => showScreen('startScreen'));

// Settings
document.getElementById('toggleSound').addEventListener('change', e => {
  soundOn = e.target.checked;
});

// Setup
document.querySelectorAll('.bomb-opt').forEach(opt => {
  opt.addEventListener('click', () => {
    document.querySelectorAll('.bomb-opt').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    bombCount = parseInt(opt.dataset.bombs);
  });
});

document.getElementById('playBtn').addEventListener('click', () => {
  multiplier = bombCount === 1 ? 1 : 2;
  score = 0; round = 1;
  showScreen('gameScreen');
  startRound();
});

// Game
function startRound() {
  roundOver = false;
  cards = [];
  for (let i = 0; i < 6; i++) cards.push(i < bombCount ? 'bomb' : 'safe');
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  document.getElementById('roundVal').textContent = round;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('bombVal').textContent = bombCount;
  document.getElementById('safeVal').textContent = 6 - bombCount;
  document.getElementById('infoB').textContent = bombCount;
  document.getElementById('infoS').textContent = 6 - bombCount;
  document.getElementById('roundBanner').textContent = '▸ PILIH SATU KARTU ◂';
  renderCards(Array(6).fill(null));
}

function drawSkull(canvas) {
  const ctx = canvas.getContext('2d');
  canvas.width = 16; canvas.height = 16;
  const p = ['0000011110000000','0000111111100000','0001111111110000','0011111111111000','0011011111011000','0011001111001000','0011111111111000','0001111111110000','0001111111110000','0000110110110000','0000111111110000','0000011001100000','0000000000000000','0000000000000000','0000000000000000','0000000000000000'];
  p.forEach((row, y) => row.split('').forEach((c, x) => { if (c==='1') { ctx.fillStyle='#e03030'; ctx.fillRect(x,y,1,1); } }));
}

function drawHeart(canvas) {
  const ctx = canvas.getContext('2d');
  canvas.width = 16; canvas.height = 16;
  const p = ['0000000000000000','0001100001100000','0011110011110000','0111111111111000','0111111111111000','0111111111111000','0011111111110000','0001111111100000','0000111111000000','0000011110000000','0000001100000000','0000000000000000','0000000000000000','0000000000000000','0000000000000000','0000000000000000'];
  p.forEach((row, y) => row.split('').forEach((c, x) => { if (c==='1') { ctx.fillStyle='#2ecc71'; ctx.fillRect(x,y,1,1); } }));
}

function renderCards(revealed) {
  const area = document.getElementById('cardsArea');
  area.innerHTML = '';
  cards.forEach((type, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (revealed[i] !== null ? (' revealed ' + type) : '');
    if (roundOver && revealed[i] === null) card.classList.add('disabled');
    if (revealed[i] !== null) {
      const cnv = document.createElement('canvas');
      if (type === 'bomb') drawSkull(cnv); else drawHeart(cnv);
      card.appendChild(cnv);
    } else {
      const back = document.createElement('div');
      back.className = 'card-back';
      back.innerHTML = '<span class="card-back-icon">🂠</span>';
      card.appendChild(back);
      if (!roundOver) card.addEventListener('click', () => pickCard(i, revealed));
    }
    area.appendChild(card);
  });
}

function pickCard(i, revealed) {
  if (roundOver) return;
  const rev = [...revealed];
  rev[i] = cards[i];
  roundOver = true;
  renderCards(rev);
  const type = cards[i];
  setTimeout(() => {
    if (type === 'bomb') {
      document.getElementById('cardsArea').classList.add('shake');
      setTimeout(() => document.getElementById('cardsArea').classList.remove('shake'), 500);
      playSound('foxySound');
      showResult('lose', 0);
    } else {
      playSound('yipeeSound');
      const pts = round * multiplier;
      score += pts;
      document.getElementById('scoreVal').textContent = score;
      showResult('win', pts);
    }
  }, 400);
}

function showResult(type, pts) {
  lastResult = type;
  const overlay = document.getElementById('resultOverlay');
  const title = document.getElementById('resultTitle');
  const ptsEl = document.getElementById('resultPts');
  const btnNext = document.getElementById('btnNext');
  const scoreLabel = document.getElementById('resultScore');
  overlay.style.display = 'flex';
  ptsEl.style.color = 'var(--gold)';
  if (type === 'win') {
    title.textContent = '✓ SELAMAT!';
    title.className = 'result-title win';
    ptsEl.textContent = '+' + pts + ' PTS';
    scoreLabel.textContent = 'POIN DIDAPAT';
    btnNext.textContent = '▶ ROUND ' + (round+1);
  } else {
    title.textContent = '💀 KENA BOM!';
    title.className = 'result-title lose';
    ptsEl.textContent = 'GAME OVER';
    ptsEl.style.color = 'var(--red)';
    scoreLabel.textContent = 'TOTAL SCORE: ' + score;
    btnNext.textContent = '↺ PILIH LAGI';
  }
}

document.getElementById('btnNext').addEventListener('click', () => {
  document.getElementById('resultOverlay').style.display = 'none';
  if (lastResult === 'lose') {
    score = 0; round = 1;
    showScreen('setupScreen');
  } else {
    round++;
    startRound();
  }
});

document.getElementById('btnQuit').addEventListener('click', () => {
  document.getElementById('resultOverlay').style.display = 'none';
  score = 0; round = 1;
  showScreen('startScreen');
});

// Init
showScreen('startScreen');
</script>
</body>
</html>
