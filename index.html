<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter security code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07080a; --panel:#0d0f12; --line:#262b33; --text:#e8eaed; --muted:#8b93a1; --error:#ff6b6b; --acc:#dfe8f3; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at top, #12151a 0%, var(--bg) 60%); color: var(--text); font-family: "Share Tech Mono", "Courier New", monospace; display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
  body.in { padding: 70px 12px 12px; align-items: flex-start; }
  main { width: 100%; max-width: 400px; text-align: center; }
  main.wide { max-width: 1100px; text-align: left; }
  h1 { font-size: 1.45rem; letter-spacing: 0.06em; margin: 0 0 14px; font-weight: 400; }
  p.sub { margin: 0 0 26px; font-size: 1.05rem; color: var(--muted); }
  .badge { width: 150px; height: 150px; margin: 0 auto 26px; border: 2px solid var(--line); border-radius: 50%; display: grid; place-items: center; background: var(--panel); box-shadow: 0 0 40px rgba(255,255,255,0.04); }
  .badge svg { width: 72px; height: 72px; stroke: var(--acc); fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .otp-row { display: flex; gap: 10px; justify-content: center; }
  .otp { flex: 1; min-width: 0; max-width: 56px; height: 62px; text-align: center; font: inherit; font-size: 1.6rem; color: #fff; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; outline: none; padding: 0; }
  .otp:focus-visible { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.14); }
  .otp-row.wrong { animation: shake .35s; }
  .otp-row.wrong .otp { border-color: var(--error); }
  .error { color: var(--error); margin: 12px 0 0; min-height: 1.3em; }
  .btn { width: 100%; margin-top: 14px; font: inherit; font-size: 1.1rem; padding: 14px; color: #0a0b0d; background: var(--acc); border: 0; border-radius: 10px; cursor: pointer; }
  .btn:focus-visible, .link:focus-visible, .menu-btn:focus-visible, .card:focus-visible, .fun-back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .btn:active { transform: translateY(1px); }
  .link { margin-top: 18px; font: inherit; color: var(--text); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 6px; }
  .pop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(0,0,0,0.75); }
  .pop-card { width: 100%; max-width: 340px; padding: 22px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-align: left; }
  .pop-card h2 { margin: 0 0 14px; font-size: 1.1rem; font-weight: 400; color: var(--muted); }
  .bin { margin: 0 0 6px; font-size: 1.2rem; line-height: 1.7; word-spacing: 0.3em; word-break: break-word; }
  .dash { display: grid; gap: 12px; }
  .panel { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .lab { font-size: 0.78rem; letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
  .live { color: #ff5d5d; margin-left: 10px; animation: blink 1.2s steps(2) infinite; }
  .hd { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; }
  .clock { font-size: clamp(2.4rem, 11vw, 4rem); line-height: 1.1; }
  .clock small { font-size: 0.45em; color: var(--muted); }
  .date { text-align: right; font-size: 0.95rem; color: var(--muted); }
  .globe { width: 100%; max-width: 620px; margin: 0 auto; }
  .globe canvas { display: block; width: 100%; aspect-ratio: 1; touch-action: none; cursor: grab; }
  .menu-btn { position: fixed; top: 12px; right: 12px; z-index: 21; display: flex; align-items: center; gap: 8px; padding: 10px 14px; font: inherit; color: var(--text); background: rgba(13,15,18,0.92); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .menu-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
  .menu-panel { position: fixed; top: 60px; right: 12px; z-index: 20; width: min(92vw, 320px); display: grid; gap: 10px; padding: 12px; background: rgba(7,8,10,0.97); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
  .card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px; text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .card b { display: block; font-weight: 400; font-size: 1.1rem; }
  .card small { color: var(--muted); font-size: 0.85rem; }
  .ico { flex: none; width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; background: #15181d; }
  .ico svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .card.fun { cursor: pointer; border: 1px solid transparent; background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(135deg, #8b7bff, #27d9ff 60%, #8b7bff) border-box; box-shadow: 0 0 22px rgba(120,110,255,0.25); }
  .card.fun:hover { box-shadow: 0 0 30px rgba(39,217,255,0.35); }
  .card.fun .ico { color: #fff; background: linear-gradient(135deg, #2a2457, #0f3a47); }
  .card.soon { opacity: 0.55; border-style: dashed; cursor: default; }
  .card.soon .ico { color: var(--muted); }
  .fun { position: fixed; inset: 0; z-index: 40; background: #000; }
  .fun canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .fun-back { position: absolute; top: 12px; left: 12px; padding: 10px 14px; font: inherit; color: var(--text); background: rgba(13,15,18,0.9); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .fun-hint { position: absolute; bottom: 18px; left: 0; right: 0; margin: 0; text-align: center; color: var(--muted); font-size: 0.9rem; pointer-events: none; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .otp-row.wrong, .live { animation: none; } }
</style>
</head>
<body>
<button id="menuBtn" class="menu-btn" hidden aria-expanded="false" aria-controls="menuPanel"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
<div id="menuPanel" class="menu-panel" hidden>
  <button type="button" id="openFun" class="card fun">
    <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="3.5"/><circle cx="12" cy="7.5" r="1.8"/><path d="M9 11 4 7M9 13l-5 1M9.5 15.5 5 20M15 11l5-4M15 13l5 1M14.5 15.5 19 20"/></svg></span>
    <span><b>Fun</b><small>Mainkan spider yang mengikuti kursor</small></span>
  </button>
  <div class="card soon"><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span><b>Coming soon</b></span></div>
  <div class="card soon"><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span><span><b>Coming soon</b></span></div>
</div>

<main>
  <section id="gate">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 48 48"><path d="M14 21v-6a10 10 0 0 1 20 0v6"/><rect x="8" y="21" width="32" height="22" rx="3"/><circle cx="24" cy="31" r="1.6"/><path d="M24 33v4"/></svg>
    </div>
    <h1>CODE REQUIRED</h1>
    <p class="sub">Enter the code to continue.</p>
    <form id="form" autocomplete="off" novalidate>
      <div id="otpRow" class="otp-row">
        <input class="otp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Character 1">
        <input class="otp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Character 2">
        <input class="otp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Character 3">
        <input class="otp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Character 4">
        <input class="otp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Character 5">
      </div>
      <p id="err" class="error" role="alert"></p>
      <button type="submit" class="btn">Confirm</button>
      <button type="button" id="help" class="link" hidden>What a code?</button>
    </form>
    <div id="pop" class="pop" role="dialog" aria-modal="true" aria-labelledby="popTitle" hidden>
      <div class="pop-card">
        <h2 id="popTitle">Hint</h2>
        <p class="bin">00110001 00110110 01101101 01110010 01110100</p>
        <button type="button" id="closePop" class="btn">Close</button>
      </div>
    </div>
  </section>

  <section id="home" hidden>
    <div class="dash">
      <div class="panel hd">
        <div>
          <div class="lab">World Monitor<span class="live">&#9679; LIVE</span></div>
          <div class="clock"><span id="hm">00:00</span><small id="ss">:00</small><small id="cs">.00</small></div>
        </div>
        <div class="date"><div id="dt"></div><div id="tz"></div></div>
      </div>
      <div class="panel globe">
        <div class="lab">Global view &middot; drag to rotate</div>
        <canvas id="globe" aria-label="Globe interaktif"></canvas>
        <div class="lab" id="coord"></div>
      </div>
    </div>
  </section>
</main>

<div id="fun" class="fun" hidden>
  <canvas id="spiderCv"></canvas>
  <button type="button" id="funBack" class="fun-back">&larr; Kembali</button>
  <p class="fun-hint">Gerakkan kursor atau sentuh layar</p>
</div>

<script>
  var SECRET = "16mrt";
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var cells = [].slice.call(document.querySelectorAll(".otp")), row = $("otpRow"), err = $("err");
    var help = $("help"), pop = $("pop");
    function val() { return cells.map(function (c) { return c.value; }).join(""); }
    function ok() {
      $("gate").hidden = true; $("home").hidden = false; document.title = "World Monitor";
      document.querySelector("main").classList.add("wide"); document.body.classList.add("in");
      $("menuBtn").hidden = false; startDash();
    }
    function fail() {
      err.textContent = "Wrong code. Try again."; help.hidden = false;
      row.classList.remove("wrong"); void row.offsetWidth; row.classList.add("wrong");
      setTimeout(function () { cells.forEach(function (c) { c.value = ""; }); cells[0].focus(); }, 350);
    }
    function check() { if (val().trim().toLowerCase() === SECRET) ok(); else fail(); }
    cells.forEach(function (c, i) {
      c.addEventListener("input", function () {
        c.value = c.value.slice(-1);
        if (!c.value) return;
        if (i < cells.length - 1) cells[i + 1].focus(); else if (val().length === cells.length) check();
      });
      c.addEventListener("keydown", function (e) {
        if (e.key === "Backspace" && !c.value && i > 0) { cells[i - 1].value = ""; cells[i - 1].focus(); e.preventDefault(); }
        else if (e.key === "ArrowLeft" && i > 0) cells[i - 1].focus();
        else if (e.key === "ArrowRight" && i < cells.length - 1) cells[i + 1].focus();
      });
      c.addEventListener("focus", function () { c.select(); });
      c.addEventListener("paste", function (e) {
        e.preventDefault();
        var t = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\s/g, "").slice(0, cells.length);
        for (var k = 0; k < cells.length; k++) cells[k].value = t.charAt(k);
        cells[Math.min(t.length, cells.length - 1)].focus();
        if (t.length === cells.length) check();
      });
    });
    $("form").addEventListener("submit", function (e) { e.preventDefault(); check(); });
    help.addEventListener("click", function () { pop.hidden = false; $("closePop").focus(); });
    function closeHint() { pop.hidden = true; cells[0].focus(); }
    $("closePop").addEventListener("click", closeHint);
    pop.addEventListener("click", function (e) { if (e.target === pop) closeHint(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) closeHint(); });
    cells[0].focus();
  })();

  // Dashboard
  var LAND = [[-168,66,-156,71,-125,70,-95,72,-82,68,-92,60,-82,52,-78,58,-65,60,-56,52,-66,44,-76,35,-81,30,-80,25,-90,29,-97,26,-97,20,-90,21,-88,16,-83,11,-77,8,-86,12,-97,16,-105,20,-106,23,-114,31,-117,32.5,-124,40,-124,48,-135,57,-150,60,-158,57,-165,60],[-73,78,-60,82,-30,83,-18,78,-22,70,-40,65,-44,60,-52,64,-58,75],[-77,8,-72,12,-62,10,-52,5,-50,0,-35,-5,-39,-14,-41,-22,-48,-26,-53,-34,-58,-35,-65,-42,-68,-50,-69,-54,-74,-48,-73,-40,-71,-30,-70,-18,-76,-14,-81,-5,-79,1],[-9,43,-9,37,-5,36,3,42,9,44,12,42,16,38,18,40,13,45,19,41,22,37,26,40,29,41,27,37,36,36,35,31,35,28,39,22,43,14,52,16,58,21,56,26,51,24,48,30,56,27,61,25,67,25,73,17,77,8,80,15,85,20,88,22,92,21,98,16,99,8,104,1.5,101,7,100,13,106,10,109,12,106,20,110,21,117,23,122,30,119,35,122,37,118,39,125,39.5,126,35,130,36,130,42,140,48,141,53,137,55,142,59,156,62,156,51,163,58,180,66,180,69,150,71,113,74,95,76,80,73,68,69,55,68,44,68,34,66,41,64,35,64,30,70,18,70,10,63,5,61,8,58,11,59,12,56,16,56,19,59,17,62,21,65,25,65,22,60,30,60,24,57,21,55,9,54,8,57,4,52,-2,49,-4,48,-1,46,-2,43.5],[-17,21,-17,14,-13,9,-8,4.5,4,6,9,4,9,0,12,-5,13,-12,12,-17,15,-27,18,-32,26,-34,32,-28,35,-24,35,-20,40,-16,40,-11,39,-6,41,-2,44,2,51,11,44,11,39,16,37,21,34,27,33,31,20,32,11,37,0,35,-6,36,-10,31,-13,28],[114,-22,122,-18,129,-15,137,-12,136,-15,142,-11,146,-19,153,-26,151,-34,147,-38,141,-38,135,-34,124,-34,115,-34,113,-26],[-5,50,1,51,2,53,-2,58,-6,58,-4,53],[95,5,104,-2,106,-6,100,-2],[109,1,117,7,119,3,116,-4,110,-3],[131,-1,145,-4,150,-10,140,-8,132,-4],[44,-25,50,-15,49,-12,44,-20],[130,31,132,34,136,34,140,35,142,38.5,141,41.5,139.5,40,138,37,135,35.5,131,34.5],[140,42,142,45,145,43.5,143,42],[142,46,144,50,143,54,142,51],[120,22,121.5,25,122,24,121,22],[120,18,122,18,124,14,121,13.5,120,16],[122,7,126,7,126,9.5,123,9],[80,9.5,82,7,81,6,80,6.5],[119,-5,120,0,125,1.5,121,-1,122,-5],[105.5,-6,114.5,-7.5,114,-8.5,106,-7.5],[144.5,-41,148,-41,147.5,-43.5,146,-43.5],[172,-35,178,-38,174,-41,172,-41],[172.5,-40.5,174,-41.5,171,-45,167,-46,168,-44],[-85,22,-80,23,-74,20,-78,20,-82,22],[-74,19.5,-69,19.5,-68.5,18.3,-72,18],[-24,65,-18,66.5,-14,65,-18,63.5],[-10,52,-6,52,-6,55,-9,54.5],[-80,73,-68,70,-62,66,-65,63,-72,64,-78,65,-90,70],[-90,77,-70,80,-62,82,-80,83,-92,81],[-118,72,-105,73,-100,70,-115,69],[-59,47.5,-53,47,-53,51.5,-56,51.5],[11,78,20,80,27,79,18,77],[52,71,58,75,68,77,60,73,55,70.5],[12.5,38,15.5,38,15,36.7],[8.2,41,9.7,41,9.5,39,8.4,39],[28,41.5,28,44,30,46,33,45.5,36,45,38,47,41,41.5,36,41.5,31,41],[47,45,50,46.5,53,45,53,41,54,37,50,37,49,40,47,43],[-180,-72,-160,-72,-140,-72,-120,-72,-100,-72,-80,-65,-60,-65,-40,-72,-20,-72,0,-72,20,-72,40,-72,60,-72,80,-72,100,-72,120,-72,140,-72,160,-72]];
  var dashOn = false;
  function startDash() {
    if (dashOn) return; dashOn = true;
    var $ = function (i) { return document.getElementById(i); };
    $("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
    function z(n) { return (n < 10 ? "0" : "") + n; }
    function tick() {
      var d = new Date();
      $("hm").textContent = z(d.getHours()) + ":" + z(d.getMinutes());
      $("ss").textContent = ":" + z(d.getSeconds());
      $("cs").textContent = "." + z(Math.floor(d.getMilliseconds() / 10));
      $("dt").textContent = d.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }
    tick(); setInterval(tick, 50);

    // Globe: garis pantai benua dan pulau
    var cv = $("globe"), g = cv.getContext("2d"), D = Math.PI / 180;
    var polys = LAND.map(function (f) {
      var out = [], n = f.length / 2;
      for (var i = 0; i < n; i++) {
        var a0 = f[2 * i], a1 = f[2 * i + 1], j = (i + 1) % n;
        var dl = ((f[2 * j] - a0 + 540) % 360) - 180, dt = f[2 * j + 1] - a1;
        var st = Math.max(1, Math.ceil(Math.max(Math.abs(dl), Math.abs(dt)) / 2));
        for (var k = 0; k < st; k++) out.push([a0 + dl * k / st, a1 + dt * k / st]);
      }
      out.push(out[0]); return out;
    });
    var auto = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.15;
    var lon0 = 110, lat0 = 20, spin = auto, drag = false, lx = 0, ly = 0, W = 300, dp = 1;
    function fit() {
      dp = window.devicePixelRatio || 1; W = cv.clientWidth || 300;
      cv.width = cv.height = Math.round(W * dp); g.setTransform(dp, 0, 0, dp, 0, 0);
    }
    function proj(lo, la) {
      var l = (lo - lon0) * D, p = la * D, p0 = lat0 * D, c = Math.cos(p);
      return [c * Math.sin(l), Math.cos(p0) * Math.sin(p) - Math.sin(p0) * c * Math.cos(l), Math.sin(p0) * Math.sin(p) + Math.cos(p0) * c * Math.cos(l)];
    }
    function line(pts, R, c) {
      g.beginPath(); var pen = false;
      for (var i = 0; i < pts.length; i++) {
        var q = proj(pts[i][0], pts[i][1]);
        if (q[2] > 0) { var x = c + R * q[0], y = c - R * q[1]; if (pen) g.lineTo(x, y); else g.moveTo(x, y); pen = true; } else pen = false;
      }
      g.stroke();
    }
    function draw() {
      var R = W * 0.43, c = W / 2, i, k;
      g.clearRect(0, 0, W, W); g.lineJoin = "round";
      var gr = g.createRadialGradient(c, c, R * 0.2, c, c, R);
      gr.addColorStop(0, "rgba(30,38,52,0.5)"); gr.addColorStop(1, "rgba(6,8,12,0.9)");
      g.fillStyle = gr; g.beginPath(); g.arc(c, c, R, 0, 7); g.fill();
      g.strokeStyle = "rgba(190,205,225,0.9)"; g.lineWidth = 2; g.shadowColor = "#dfe8f3"; g.shadowBlur = 12;
      g.beginPath(); g.arc(c, c, R, 0, 7); g.stroke(); g.shadowBlur = 0;
      g.setLineDash([3, 9]); g.strokeStyle = "rgba(190,205,225,0.4)"; g.lineWidth = 1;
      g.beginPath(); g.arc(c, c, R * 1.07, 0, 7); g.stroke(); g.setLineDash([]);
      g.strokeStyle = "rgba(190,205,225,0.14)";
      for (k = -60; k <= 60; k += 30) { var a = []; for (i = -180; i <= 180; i += 6) a.push([i, k]); line(a, R, c); }
      for (k = -180; k < 180; k += 30) { var b = []; for (i = -90; i <= 90; i += 6) b.push([k, i]); line(b, R, c); }
      g.strokeStyle = "rgba(190,205,225,0.2)"; g.lineWidth = 4;
      polys.forEach(function (p) { line(p, R, c); });
      g.strokeStyle = "#dfe8f3"; g.lineWidth = 1.4;
      polys.forEach(function (p) { line(p, R, c); });
      var lo = ((lon0 + 540) % 360) - 180;
      $("coord").textContent = "LON " + lo.toFixed(1) + "\u00b0  LAT " + lat0.toFixed(1) + "\u00b0";
    }
    function frame() {
      if (!drag) { lon0 += spin; spin += (auto - spin) * 0.02; }
      draw(); requestAnimationFrame(frame);
    }
    cv.addEventListener("pointerdown", function (e) { drag = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
      lon0 -= dx * 0.4; lat0 = Math.max(-80, Math.min(80, lat0 + dy * 0.4)); spin = -dx * 0.4;
    });
    cv.addEventListener("pointerup", function () { drag = false; });
    cv.addEventListener("pointercancel", function () { drag = false; });
    window.addEventListener("resize", fit);
    fit(); frame();
  }

  // Menu + spider
  (function () {
    var $ = function (i) { return document.getElementById(i); };
    var mb = $("menuBtn"), mp = $("menuPanel"), fun = $("fun"), cv = $("spiderCv"), g = cv.getContext("2d");
    function menu(o) { mp.hidden = !o; mb.setAttribute("aria-expanded", o ? "true" : "false"); }
    mb.addEventListener("click", function () { menu(mp.hidden); });
    document.addEventListener("click", function (e) { if (!mp.hidden && !mp.contains(e.target) && !mb.contains(e.target)) menu(false); });

    function Spider(x, y, s) {
      this.x = x; this.y = y; this.s = s; this.h = 0; this.vx = 0; this.vy = 0; this.legs = [];
      for (var side = -1; side <= 1; side += 2) for (var k = 0; k < 4; k++) {
        var L = { ang: side * (0.7 + k * 0.55), side: side, st: null, par: (k + (side > 0 ? 1 : 0)) % 2 };
        L.fx = x + Math.cos(L.ang) * 62 * s; L.fy = y + Math.sin(L.ang) * 62 * s; this.legs.push(L);
      }
    }
    Spider.prototype.tick = function (dt, tx, ty) {
      var s = this.s, dx = tx - this.x, dy = ty - this.y, d = Math.sqrt(dx * dx + dy * dy);
      var sp = d > 14 ? Math.min(d * 2.4, 220 * s) : 0, e = Math.min(1, dt * 8);
      this.vx += ((d ? dx / d : 0) * sp - this.vx) * e; this.vy += ((d ? dy / d : 0) * sp - this.vy) * e;
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (sp > 1) { var da = ((Math.atan2(dy, dx) - this.h + Math.PI * 3) % (Math.PI * 2)) - Math.PI; this.h += da * Math.min(1, dt * 6); }
      var i, L, a, ix, iy, T, p, busy = [0, 0];
      for (i = 0; i < 8; i++) if (this.legs[i].st) busy[this.legs[i].par]++;
      for (i = 0; i < 8; i++) {
        L = this.legs[i]; a = this.h + L.ang;
        ix = this.x + Math.cos(a) * 62 * s + this.vx * 0.16; iy = this.y + Math.sin(a) * 62 * s + this.vy * 0.16;
        if (L.st) {
          T = L.st; T.t += dt / 0.14; p = Math.min(T.t, 1); p = p * p * (3 - 2 * p);
          L.fx = T.x0 + (T.x1 - T.x0) * p; L.fy = T.y0 + (T.y1 - T.y0) * p;
          if (T.t >= 1) L.st = null;
        } else if ((Math.hypot(L.fx - ix, L.fy - iy) > 26 * s && busy[1 - L.par] === 0) || Math.hypot(L.fx - this.x, L.fy - this.y) > 80 * s) {
          L.st = { t: 0, x0: L.fx, y0: L.fy, x1: ix, y1: iy }; busy[L.par]++;
        }
      }
    };
    Spider.prototype.draw = function (g) {
      var s = this.s, l1 = 34 * s, l2 = 46 * s, i, L, a, hx, hy, dx, dy, dd, an, A, ax, ay, bx, by, o;
      g.lineWidth = Math.max(1.4, 2.2 * s); g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#fff";
      for (i = 0; i < 8; i++) {
        L = this.legs[i]; a = this.h + L.ang; hx = this.x + Math.cos(a) * 5 * s; hy = this.y + Math.sin(a) * 5 * s;
        dx = L.fx - hx; dy = L.fy - hy; dd = Math.sqrt(dx * dx + dy * dy);
        dd = Math.max(Math.abs(l1 - l2) + 1, Math.min(dd, l1 + l2 - 0.5)); an = Math.atan2(dy, dx);
        A = Math.acos(Math.max(-1, Math.min(1, (l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd))));
        ax = hx + Math.cos(an + A) * l1; ay = hy + Math.sin(an + A) * l1;
        bx = hx + Math.cos(an - A) * l1; by = hy + Math.sin(an - A) * l1;
        o = Math.hypot(ax - this.x, ay - this.y) > Math.hypot(bx - this.x, by - this.y);
        g.beginPath(); g.moveTo(hx, hy); g.lineTo(o ? ax : bx, o ? ay : by); g.lineTo(L.fx, L.fy); g.stroke();
      }
      g.fillStyle = "#fff"; var c = Math.cos(this.h), n = Math.sin(this.h);
      g.beginPath(); g.arc(this.x, this.y, 7 * s, 0, 7); g.fill();
      g.beginPath(); g.arc(this.x - c * 11 * s, this.y - n * 11 * s, 10 * s, 0, 7); g.fill();
      g.beginPath(); g.arc(this.x + c * 8 * s, this.y + n * 8 * s, 4.5 * s, 0, 7); g.fill();
    };

    var sp = [], stars = [], W = 0, H = 0, raf = 0, last = 0, px = null, py = null, time = 0;
    function size() {
      var d = window.devicePixelRatio || 1; W = window.innerWidth; H = window.innerHeight;
      cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); stars = [];
      for (var i = 0; i < 150; i++) stars.push([Math.random() * W, Math.random() * H, Math.random() * 1.6 + 0.4, Math.random() * 0.5 + 0.2]);
    }
    function loop(t) {
      var dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t; time += dt;
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.fillStyle = "#fff";
      stars.forEach(function (q) { g.globalAlpha = q[3]; g.fillRect(q[0], q[1], q[2], q[2]); }); g.globalAlpha = 1;
      var cx = px === null ? W / 2 + Math.cos(time * 0.5) * W * 0.3 : px, cy = py === null ? H / 2 + Math.sin(time * 0.7) * H * 0.25 : py;
      sp.forEach(function (s, i) {
        var a = time * 0.6 + i * Math.PI, r = i ? 90 : 0;
        s.tick(dt, cx + Math.cos(a) * r, cy + Math.sin(a) * r); s.draw(g);
      });
      raf = requestAnimationFrame(loop);
    }
    function openFun() {
      menu(false); fun.hidden = false; size(); px = py = null;
      sp = [new Spider(W * 0.35, H * 0.5, 1), new Spider(W * 0.65, H * 0.55, 0.75)];
      last = performance.now(); raf = requestAnimationFrame(loop);
    }
    function closeFun() { fun.hidden = true; cancelAnimationFrame(raf); }
    function aim(e) { px = e.clientX; py = e.clientY; }
    cv.addEventListener("pointermove", aim); cv.addEventListener("pointerdown", aim);
    $("openFun").addEventListener("click", openFun);
    $("funBack").addEventListener("click", closeFun);
    window.addEventListener("resize", function () { if (!fun.hidden) size(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if (!fun.hidden) closeFun(); else menu(false); } });
  })();
</script>
</body>
</html>
